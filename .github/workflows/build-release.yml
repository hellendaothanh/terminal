name: Build and Release OmniTerminal

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          # Full history + tags are required to generate the changelog from commits
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Sync Version from Git Tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if [ "$CURRENT_VERSION" != "$TAG_VERSION" ]; then
            echo "Syncing package.json version from $CURRENT_VERSION to $TAG_VERSION..."
            npm version $TAG_VERSION --no-git-tag-version
          else
            echo "package.json version is already up-to-date ($CURRENT_VERSION)."
          fi

      - name: Compile Application
        run: npm run compile

      - name: Build macOS Artifacts
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows Artifacts
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node scripts/generate-changelog.mjs --latest --out release_notes.md

      - name: Update CHANGELOG.md in Repository
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'macos-latest'
        shell: bash
        continue-on-error: true
        run: |
          node scripts/generate-changelog.mjs --full
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "CHANGELOG.md is already up-to-date."
          else
            git commit -m "docs(changelog): update for ${GITHUB_REF_NAME} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload Release Binaries to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: release_notes.md
          files: |
            dist-app/*.dmg
            dist-app/*.zip
            dist-app/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
